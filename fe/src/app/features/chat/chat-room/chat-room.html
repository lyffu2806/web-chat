<div class="header">
  <h1>Trang chủ</h1>
  <div class="user-info" *ngIf="currentUser">
    Xin chào, <strong>{{ currentUser.username }}</strong>
  </div>
</div>

<div class="section">
  <div class="section-title">
    <span>👥 {{ total }} | Người dùng</span>
  </div>

  <div class="user-list" *ngIf="!loading; else loadingTpl">
    <div class="user-row" *ngFor="let u of users">
      <div class="avatar">{{ u.username[0].toUpperCase() }}</div>
      <div class="info">
        <p class="name">
          {{ u.username }}
          <span class="online-badge" *ngIf="u.isOnline">ON</span>
          <span class="offline-badge" *ngIf="!u.isOnline">OFF</span>
        </p>
        <p class="email" *ngIf="u.isOnline">Đang trực tuyến</p>
        <p class="email" *ngIf="!u.isOnline">{{ getLastSeen(u.lastSeen) }}</p>
      </div>
      <button *ngIf="u.username != currentUser?.username" class="msg-btn" (click)="openChat(u.id)">
        ✉️
      </button>
    </div>
  </div>

  <ng-template #loadingTpl>
    <p class="loading">Đang tải...</p>
  </ng-template>
</div>
