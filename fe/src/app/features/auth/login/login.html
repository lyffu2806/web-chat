<div class="auth-container">
  <div class="auth-card">
    <h1>Đăng nhập</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Tên tài khoản</label>
        <input type="text" formControlName="username" placeholder="Tên tài khoản" />
        <span class="error-text" *ngIf="form.get('username')?.invalid && submitted">
          Vui lòng nhập tên tài khoản
        </span>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        <span class="error-text" *ngIf="form.get('password')?.invalid && submitted">
          Vui lòng nhập mật khẩu
        </span>
      </div>
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="switch">Chưa có tài khoản? <a routerLink="/auth/register">Đăng ký</a></p>
  </div>
</div>

<!-- Dialog lỗi từ server -->
<div class="dialog-overlay" *ngIf="showError" (click)="closeError()">
  <div class="dialog-box" (click)="$event.stopPropagation()">
    <div class="dialog-icon">⚠️</div>
    <h3>Thông báo</h3>
    <p>{{ errorMessage }}</p>
    <button class="dialog-btn" (click)="closeError()">Đóng</button>
  </div>
</div>
